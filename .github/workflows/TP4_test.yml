name: CI/CD Pipeline - Desarrollo

# Ejecutar SOLO cuando se crea un Pull Request hacia la rama develop
on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

env:
  PYTHON_VERSION: 3.11

jobs:
  quality-checks:
    name: "Análisis de Calidad de Código"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache de dependencias
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar formato de código (Black)
      run: |
        black --check --diff .
      continue-on-error: false

    - name: Verificar ordenamiento de imports (isort)
      run: |
        isort --check-only --diff .
      continue-on-error: false

    - name: Análisis estático (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Verificación de tipos (mypy)
      run: |
        mypy --ignore-missing-imports .
      continue-on-error: true

    - name: Análisis de seguridad (bandit)
      run: |
        bandit -r . -f json -o bandit-report.json
        bandit -r . -f txt
      continue-on-error: true

    - name: Verificar vulnerabilidades en dependencias
      run: |
        safety check --json --output safety-report.json
        safety check
      continue-on-error: true

  unit-tests:
    name: "Pruebas Unitarias"
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache de dependencias
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas unitarias con cobertura
      run: |
        pytest test_calculadora.py -v \
          --cov=calculadora_python \
          --cov-report=html \
          --cov-report=xml \
          --cov-report=term \
          --cov-fail-under=80 \
          --html=pytest-report.html \
          --self-contained-html

    - name: Subir reporte de cobertura
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Subir artifacts de reportes
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports
        path: |
          pytest-report.html
          htmlcov/
          coverage.xml

  integration-tests:
    name: "Pruebas de Integración"
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas de integración
      run: |
        # Por ahora ejecutamos las mismas pruebas como integración
        # En un proyecto real aquí irían pruebas de componentes
        pytest test_integration.py -v -m integration || true
        echo "Pruebas de integración completadas"

  build:
    name: "Build y Verificación"
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Instalar dependencias de build
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: Crear distribución
      run: |
        cat > setup.py << 'EOF'
        from setuptools import setup, find_packages
        
        setup(
            name='calculadora-python',
            version='1.0.0',
            py_modules=['calculadora_python'],
            python_requires='>=3.8',
            install_requires=[],
            author='Equipo TP7',
            description='Calculadora básica para demostrar CI/CD',
        )
        EOF
        python -m build

    - name: Verificar instalación del paquete
      run: |
        pip install dist/*.whl
        python -c "from calculadora_python import Calculadora; calc = Calculadora(); print(f'Test: 2+2={calc.sumar(2,2)}')"

  security-scan:
    name: "Escaneo de Seguridad"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Ejecutar análisis de seguridad con CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: python

    - name: Ejecutar análisis CodeQL
      uses: github/codeql-action/analyze@v2

  deploy-dev:
    name: "Deploy a Desarrollo"
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, integration-tests, build]
    if: github.base_ref == 'develop' && github.event_name == 'pull_request'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Simular despliegue a desarrollo
      run: |
        echo "🚀 Desplegando a ambiente de desarrollo..."
        echo "📦 Aplicación: Calculadora Python"
        echo "🔗 URL: https://dev.calculadora.ejemplo.com"
        echo "✅ Despliegue completado exitosamente"

  status-check:
    name: "Pipeline Status"
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, integration-tests, build, security-scan]
    if: always()
    
    steps:
    - name: Verificar estado del pipeline
      run: |
        echo "Estado del pipeline:"
        echo "✅ Calidad de código: ${{ needs.quality-checks.result }}"
        echo "✅ Pruebas unitarias: ${{ needs.unit-tests.result }}"
        echo "✅ Pruebas integración: ${{ needs.integration-tests.result }}"
        echo "✅ Build: ${{ needs.build.result }}"
        echo "✅ Seguridad: ${{ needs.security-scan.result }}"
        
        if [[ "${{ needs.quality-checks.result }}" == "failure" || 
              "${{ needs.unit-tests.result }}" == "failure" || 
              "${{ needs.build.result }}" == "failure" ]]; then
          echo "❌ Pipeline fallido - revisar errores arriba"
          exit 1
        else
          echo "✅ Pipeline completado exitosamente"
        fi
